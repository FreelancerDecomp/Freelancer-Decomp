; Port-only settings of the Direct3D 9 (RP9.dll) volumetric rendering. freelancer.exe reads
; this file (Client/render_ex.cpp, Client/nebula_volume.cpp) only when the render pipeline
; answers the Direct3D 9 extensions ([System] DirectX9 in bin/DACOM.INI); with DirectX8 it is
; ignored. Shaders live in DATA_EXTRA/SHADERS. See docs/re/rp9.md, "Ex extensions" and "Volumetric
; nebula".
;
; Hot reload: while in space the game checks this file and DATA_EXTRA/SHADERS/*.hlsl, *.hlsli once a
; second; after a save it re-reads the settings and recompiles every shader (a shader that does
; not compile keeps its previous version; the errors go to FLSpew.txt / the debugger output).

[Debug]
; Show the scene depth (INTZ depth texture) as greyscale over the 3D space view, before the
; HUD: near bright, far dark, empty sky dark blue. Needs an adapter with INTZ support.
scene_depth_view = false
; 0 = logarithmic between the projection's near and far planes; > 0 = linear, this distance
; (metres) and beyond shown black.
scene_depth_view_max = 0
; What the volumetric nebula shows: 0 = normal; 1 = cloud density (white = opaque cloud along
; the ray, the haze ignored); 2 = key-light shadow transmittance seen along the ray (white =
; lit, black = in the clouds' shadow); 3 = haze only (clouds removed); 4 = clouds only (haze
; removed). Views 1 and 2 cover the scene completely.
nebula_view = 0
; Lightning tuning: 1 = strikes one after another near the camera (lightning_min_distance ..
; lightning_max_distance, no far ones, no gaps); 0 = the nebula's own timing.
lightning_force = 0
; 1 = the strikes' bright cores are drawn through clouds and haze (where the lights are).
lightning_show_positions = 0

[Nebula]
; The ray-marched nebula drawn while the camera is inside a nebula zone. Its look comes from the
; nebula's own INI (DATA/SOLAR/NEBULA/*.ini): [Fog] near / distance / color, [NebulaLight]
; ambient / sun_burnthrough_intensity, [Clouds] puff_radius / puff_colora / puff_colorb /
; puff_drift / near_fade_distance, [Exclusion Zones] exclusion / fog_far. The keys below only
; tune how those values are turned into a volume. Needs ps_3_0, volume textures and the INTZ
; scene depth; without them the retail interior fog is drawn as before.
;
; The medium has two parts: a thin uniform HAZE (coloured by [Fog] color) and dense CLOUD
; masses cut out of a noise field, with empty corridors between them. Both scatter the light of
; a key light (the system's star, or a fixed light) and the ambient, so clouds have lit rims,
; dark self-shadowed cores and dark undersides, and the haze shows light shafts between them.
;
; Tuning, first keys to try: coverage (how much of space is cloud), cloud_density (how opaque a
; cloud is), haze_transmittance_at_fog_distance (how far you see between clouds),
; key_light_intensity / ambient_scale (contrast between lit and shadowed sides), exposure.
; [Debug] nebula_view 1 and 2 show the cloud field and the shadows on their own.

; 1 = on, 0 = retail interior fog everywhere.
enabled = 1

; ---- ray march ----
; Ray-march resolution as a fraction of the screen (0.125 .. 1). 0.5 = half width and height.
resolution_scale = 0.5
; Samples per ray (1 .. 128). Fewer = faster and noisier.
step_count = 96
; How samples crowd toward the camera: 1 = evenly spaced, 2 = quadratic (0.25 .. 4).
step_distribution = 1.5
; 1 = per-pixel jittered samples (smooth, slight grain), 0 = fixed sample positions (banding).
jitter = 1
; Longest ray in metres; 0 = automatic: [Fog] near + the distance at which the haze alone lets
; march_end_transmittance through (but at least auto_march_fog_distances times the largest
; exclusion fog_far span, and 1 .. 30 [Fog] distances). Beyond it only the haze goes on
; (haze_tail). Badlands with the defaults: about 5.6 km.
max_march_distance = 0
march_end_transmittance = 0.02
auto_march_fog_distances = 3

; ---- density ----
; Soft edge of the nebula zone, as a fraction of its radius (density ramps from 0 at the
; surface to full this far in). Now the narrowest the outer shell gets: the ramp is
; shell_width (see "outer shell and halo") when that is wider.
edge_softness = 0.08
; Multiplies both extinctions (haze and clouds; thicker > 1 > thinner).
density_scale = 1.25
; Fraction of light that gets through [Fog] distance metres of plain haze (no clouds). Retail's
; linear fog is opaque at that distance (about 0.03 here); the haze is much thinner so the
; clouds and the background stay visible -- lower = foggier, higher = clearer.
haze_transmittance_at_fog_distance = 0.5
; Optical depth of [Fog] distance metres of solid cloud (extinction = cloud_density / [Fog]
; distance). 6 with Badlands' 1000 m: light goes about 170 m into a solid cloud.
cloud_density = 12
; Size of the big cloud masses (the base noise cell) in metres; 0 = automatic:
; cloud_scale_fog_distances times [Fog] distance, at most a quarter of the zone's smallest
; radius (Badlands: 2.5 km).
cloud_scale_m = 0
cloud_scale_fog_distances = 1
; Fraction of space inside the cloud masses, 0 .. 1 (0 = haze only). The rest are corridors.
coverage = 0.65
; Fraction of a cloud mass that is a soft ramp from nothing to full density (the rest is solid
; core), 0.02 .. 1. Lower = harder cloud surfaces.
cloud_softness = 0.2
; Flattens the clouds along the zone's up axis into layers / decks: 1 = round, 2 = half as tall
; as wide.
layer_stretch = 1.6
; Size of the edge detail (the erosion noise cell) = [Clouds] puff_radius * detail_scale
; metres (Badlands: 400 m).
detail_scale = 12
; How much the detail noise eats into the cloud edges, 0 .. 0.95 (cores survive, thin parts
; break up).
erosion = 0.5
; 0 = billowy, round erosion; 1 = wispy, stringy erosion.
wispiness = 0.96
; Domain warp amplitude as a fraction of the cloud mass size: swirls and smears the shapes.
warp = 0.2
; Drift speed = [Clouds] puff_drift * drift_scale metres per second (the detail and the warp
; move faster and in other directions, so the clouds also change shape).
drift_scale = 12
; The clouds fade in over [Clouds] near_fade_distance times this (Badlands: 125 .. 200 m) like
; retail's puffs, so the camera never sits blind inside one; 0 = no fade.
cloud_near_fade_scale = 1
; Inside an exclusion zone retail pushes the fog end out to its fog_far; the haze thins to the
; same visibility ([Fog] distance / (fog_far - near)) and the clouds go. This multiplies that
; thinning factor (0 = completely clear pockets).
exclusion_density_scale = 1

; ---- light ----
; Cloud albedo = the [Clouds] puff colours (blended by noise) times this.
cloud_brightness = 0.7
; Haze albedo = the [Fog] color's hue at full brightness times this.
haze_albedo = 0.15
; Self-glow of the clouds = [Fog] color times this (keeps the darkest cores from going black).
emission = 0.25
; Self-glow of the haze = [Fog] color times this (1 = retail's fog colour where the haze is
; thick).
haze_emission = 0.6
; Ambient light = [NebulaLight] ambient times this.
ambient_scale = 1.5
; Ambient occlusion: the ambient is dimmed by the cloud above a sample (dark undersides).
; Strength 0 .. ; distance of the probe up the zone axis in metres, 0 = half a cloud layer.
ao_strength = 1
ao_distance = 0
; Key light: 0 = the system's star when the nebula has [NebulaLight] sun_burnthrough_intensity
; > 0, else the fixed key below; 1 = always the fixed key.
key_light_source = 0
; Star key light = its glow colour (half toward white) * sun_burnthrough_intensity * this.
key_light_intensity = 3
; Fixed key light: direction toward the light in the zone's own axes (x, y = up, z),
; colour (0, 0, 0 = [Clouds] puff_colora brightened), intensity.
key_light_dir = 0.3, 0.8, 0.5
key_light_colour = 0, 0, 0
key_light_fixed_intensity = 1.5
; Scattering phase: forward lobe (toward 1 = a bright silver lining looking toward the light),
; backward lobe and its weight (lit faces seen with the light behind you).
phase_g = 0.6
phase_back_g = 0.3
phase_back_weight = 0.2
; Multiple scattering approximation (2 extra octaves, each ms_strength as bright, with
; ms_extinction of the shadow and ms_phase of the anisotropy): light inside thick clouds.
ms_strength = 0.5
ms_extinction = 0.35
ms_phase = 0.5
; "Powder": darkens thin cloud edges seen with the light behind you, 0 .. 1.
powder_strength = 0.6
; Shadow ray toward the key light: samples 0 .. 6 (0 = no self-shadowing), length in metres
; (0 = one cloud mass size), extinction multiplier (darker > 1 > lighter).
shadow_steps = 6
shadow_distance = 0
shadow_density = 1

; ---- background and output ----
; 1 = beyond the march cap the haze goes on (in closed form) to the zone surface, so the far
; distance and the sky fade into lit haze; 0 = the haze stops at the cap (the stars show
; through what is left).
haze_tail = 1
; 1 = while the volume is drawn, also fully inside, draw the star sphere and clear to the
; system's space colour instead of the fog colour (the haze does the fogging); 0 = retail
; (fog colour, no stars when fully inside).
real_background = 1
; 1 = fully inside, push the far plane out from retail's [Fog] far + 500 to 1.5 march caps
; (otherwise objects pop in through the thinner haze); 0 = retail's plane.
extend_far_plane = 1
; The volume's light is HDR: exposure multiplies it, then tonemap 0 = clamp, 1 = Reinhard on
; luminance (tonemap_white = the luminance that maps to white), 2 = filmic (ACES fit).
exposure = 1
tonemap = 2
tonemap_white = 2
; The composite filters the low-resolution result bilinearly unless a neighbour's depth
; differs from the pixel's by more than this fraction; then it takes the best-matching sample
; (no fog halos around ships).
upsample_depth_threshold = 0.1
; Which retail parts the volume replaces while it is drawn (1 = replaced, 0 = drawn as well,
; for comparison): per-object linear fog, the fullscreen fog quad, the interior puff sprites.
replace_object_fog = 1
replace_fog_overlay = 1
replace_clouds = 1

; ---- from outside, several nebulae (phase 3) ----
; 1 = nebulae are also drawn as volumes from outside, within exterior_max_distance metres of
; their surface (the ray starts where it enters the zone; the inside look does not change);
; 0 = only the nebula the camera is in, retail outside.
exterior = 1
; Beyond this distance (metres from the camera to the zone surface) a nebula keeps its retail
; look; over the last exterior_fade_distance metres before it the volume fades out while the
; retail exterior is drawn as well (the retail parts go once the volume is at full strength).
exterior_max_distance = 80000
exterior_fade_distance = 20000
; How many nebulae are drawn per frame at most (1 .. 4), nearest first. Global: only read from
; [Nebula].
max_nebulae = 4
; Which retail exterior parts a volume at full strength replaces (1 = replaced, 0 = drawn as
; well): the axis-locked exterior billboards, the two crossing fill sheets through the zone.
replace_exterior_bits = 1
replace_fill_sheets = 1
; Level of detail by the distance from the camera to where the ray enters the zone (never
; inside): from lod_start_distance to lod_end_distance the step count falls to
; lod_min_step_fraction of step_count, the edge detail fades once its noise texel is smaller
; than a pixel (lod_detail_fade 1 = on) and past lod_shadow_switch of that range (0 .. 1; 2 =
; never) the cloud shadow ray uses 3 merged samples instead of 6.
lod_start_distance = 5000
lod_end_distance = 50000
lod_min_step_fraction = 0.5
lod_shadow_switch = 0.5
lod_detail_fade = 1
; From outside the haze also shadows the key light over the whole nebula (the sun side lit, the
; far side darker): its extinction times exterior_shadow_density (0 = off). It fades in over the
; first exterior_shadow_fade_in metres of distance to the zone entry, so inside it is off.
exterior_shadow_density = 0.25
exterior_shadow_fade_in = 5000

; ---- asteroid fields inside a drawn nebula ----
; The haze is much thinner than retail's fog, which hid where asteroid fields stop drawing
; their asteroids (fill_dist). While a drawn nebula overlaps a field, its asteroids are drawn
; out to where the haze lets asteroid_spawn_transmittance through (plus the camera's distance to
; the nebula when outside it), at most asteroid_max_spawn_distance metres (cost grows with the
; cube of the distance), and fade in over the outer asteroid_fade_fraction of that distance.
; asteroid_spawn 0 = retail fill_dist.
asteroid_spawn = 1
asteroid_spawn_transmittance = 0.05
asteroid_max_spawn_distance = 6000
asteroid_fade_fraction = 0.25

; ---- lightning inside the clouds ----
; Lightning strikes are point lights placed inside the cloud masses: they light the cloud from
; within (a bright core glow, light scattered through the cloud and the haze around it, nearby
; clouds as silhouettes), flicker in 2..4 pulses, sometimes come in bursts, and light the ships
; near them from their direction. Timing, colour and strength come from the nebula's own INI:
; [Clouds] lightning_gap / lightning_duration / lightning_color / lightning_intensity (retail
; flashed each puff on its own timer: the gap counts 4 times), else [BackgroundLightning] gap /
; duration / color (/ intensity), else a strike every ~9 s. Visible from inside and outside.
; First keys to try: lightning_intensity_scale (brightness), lightning_frequency_scale (how
; often), lightning_radius (how far the light reaches), lightning_shadow_density (how deep the
; light gets into a cloud). [Debug] lightning_force shows strikes continuously.
; 1 = on, 0 = no strikes (the nebula's [DynamicLightning] light stays retail).
lightning_enabled = 1
; Peak brightness of a strike = the nebula's lightning intensity * this (HDR, tonemapped). The
; nebula's own light (key 1.5, ambient 0.6) already sits high on the tonemap curve, so a strike
; must be several times brighter than that to show.
lightning_intensity_scale = 20
; Strikes per second = the nebula's rate * this (2 = twice as often).
lightning_frequency_scale = 1
; Strike duration (all pulses) = the nebula's lightning duration * this.
lightning_duration_scale = 1
; Chance that a strike is followed by 1..2 more close by right after it (0 .. 1).
lightning_burst_chance = 0.35
; Light colour: 0, 0, 0 = the nebula's lightning colour as a hue half toward white; else this
; colour (0 .. 1 per channel, only its hue counts).
lightning_colour = 0, 0, 0
; Radius of the light in metres (it reaches 0 there); 0 = 1.5 cloud mass sizes (see
; cloud_scale_m): a strike sits deep in a cloud mass and its light has to reach the mass's
; surface to be seen.
lightning_radius = 0
; The light falls off with the inverse square of the distance, softened inside this fraction of
; the radius (larger = a broader, flatter glow).
lightning_core_size = 0.45
; The strike itself: a bright spot of this fraction of the radius, this bright (times the
; light), seen through the cloud in front of it.
lightning_core_glow_size = 0.04
lightning_core_emission = 2
; How the light gets through the medium between strike and sample: 0 = unattenuated, 1 =
; estimated from the cloud at both ends, 2 = plus one cloud sample halfway (costs a texture
; read per light and step; far nebulae use 1); the optical depth is multiplied by
; lightning_shadow_density and the light falls off with it as 1 / (1 + depth) -- diffusion: light
; scattered many times gets much farther through a cloud than straight through (lower = deeper).
lightning_shadow = 2
lightning_shadow_density = 0.25
; Scattering of the strike light: lightning_haze_scale multiplies the haze's part (the clouds'
; part is their albedo); lightning_phase_g 0 = even in all directions, > 0 brighter looking
; toward the strike.
lightning_haze_scale = 4
lightning_phase_g = 0.2
; Random flicker of the strike brightness per frame, 0 .. 1.
lightning_flicker = 0.5
; Later pulses come from a point this fraction of the radius away from the first.
lightning_pulse_jitter = 0.1
; Where strikes happen when the camera is inside: lightning_min_distance .. lightning_max_distance
; metres from it, lightning_view_bias of them in front of the camera; lightning_far_chance of
; them farther, out to lightning_far_distance (0 = the march cap), as a distant flicker in the
; haze (retail's background flash). From outside: anywhere in the nebula, mostly on the
; camera's side. Each strike tries lightning_candidates random points and takes the densest
; cloud; a near one needs at least lightning_min_density (0 .. 1).
lightning_min_distance = 400
lightning_max_distance = 6000
lightning_view_bias = 0.75
lightning_far_chance = 0.25
lightning_far_distance = 0
lightning_candidates = 12
lightning_min_density = 0.3
; Faint flash of the whole nebula with every strike (added to the ambient), weaker for distant
; strikes. Scales with the strike's brightness (lightning_intensity_scale).
lightning_haze_flash = 0.025
; Ships near a strike are lit from its direction: 0 = no; 1 = through the nebula's
; [DynamicLightning] light (instead of its random flash; only nebulae that have one, camera
; fully inside); 2 = also through a light of our own for the other nebulae.
lightning_lights_ships = 2
; Ship light strength (times the strike's flicker; 1 = the full light colour right at the
; strike, about half at one radius); distance in metres beyond which a strike lights no ships
; (0 = 3 radii).
lightning_ship_intensity = 1.5
lightning_ship_distance = 0

; ---- outer shell and halo (how the edge looks, mostly from outside) ----
; The medium does not stop at the zone's surface: it thins out over a wide outer shell whose
; radius is displaced by low-frequency noise (an irregular silhouette with big lobes), the clouds
; get sparse there (isolated puffs and wisps near the surface), and a thin haze halo reaches
; beyond the surface. From outside the shell is thinner still, so the edge is soft and you see
; stars through it. Deep inside (beyond shell_width + shell_noise of the radius from the surface)
; nothing changes. First keys to try: shell_width, exterior_shell_density, halo_density.
; Width of the shell as a fraction of the radius (density from full at its inner side to 0 at
; the surface; the inner part stays nearly full). edge_softness above is the narrowest it gets.
shell_width = 0.55
; Displacement of the shell's radius by noise, +- this fraction of the radius (0 = a smooth
; ellipsoid), and the size of its lobes as a fraction of the radius.
shell_noise = 0.15
shell_noise_scale = 0.1
; How far the clouds' coverage drops across the shell: the cut moves this much of the way to
; "no cloud" at the surface (1 = none at the surface; more = sparse already deeper in).
shell_cloud_falloff = 1.25
; Thin haze beyond the surface: out to halo_extent of the radius, halo_density of the haze
; density at the surface, falling to 0 (0 = no halo).
halo_extent = 0.20
halo_density = 0.05
; From outside, the shell's density times this at the surface (rising to 1 at its inner side):
; lower = a more see-through rim. Fades to 1 while the camera flies in through the shell.
exterior_shell_density = 0.2
; Far away (with the level of detail, lod_start_distance .. lod_end_distance) the clouds read as
; soft masses: their coverage ramp gets 1 + far_cloud_softening times wider, and only
; 1 - far_detail_fade of their edge detail is left.
far_cloud_softening = 2
far_detail_fade = 0.6
; ---- stars and planets ----
; Star glows have no depth, so the volume would fog a star standing in front of a nebula with the
; whole nebula behind it. Inside a glow the scene is attenuated only by the medium up to the star
; instead, weighted by how much of the pixel the glow is: star_glow_weight at its centre, falling
; to 0 at the glow's edge (higher = more of the glow keeps the star's own transmittance; 0 = off,
; star glows fogged by the whole ray). Planets and moons always end the volume's rays on their
; bounding sphere (the far bucket draws them without depth).
star_glow_weight = 2

; Per-nebula overrides: one [NebulaOverride] per nebula, file = the nebula ini's name (no
; directory, no extension), then any [Nebula] key. Unlisted keys keep the [Nebula] values.
;
; [NebulaOverride]
; file = li01_badlands_nebula
; coverage = 0.5
; key_light_intensity = 4
