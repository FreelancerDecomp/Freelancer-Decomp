name: Build

on:
  push:
    branches: [master]
  pull_request:
    # labeled/unlabeled re-run the checks when the expected-change label below is set.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      crash_test:
        description: Make FLRegress crash on purpose, to test the crash report and issue path
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # DirectX 8.1 SDK (Final), the archive README.md points to. Only its include\ and lib\
  # folders are extracted; the installer itself is never run.
  DX8_SDK_URL: https://archive.org/download/dx81sdk_full/dx81sdk_full.exe
  DX8_SDK_MD5: 28533018267fa278bb1c603a67d86d2f
  # Retail Freelancer disc image. Its two cabinets hold the 1.1 game data (the 1.1 patch
  # changes no data files). DATA/ is only ever used inside the runner: never commit it and
  # never upload it as an artifact.
  FL_ISO_URL: https://archive.org/download/Freelancer_201807/Freelancer.iso
  FL_ISO_MD5: 208008c116b1ebbf70e32ba440663134
  # File count and digest from .github/scripts/data_digest.py over the extracted DATA/.
  FL_DATA_DIGEST: 8368 7236dc15f7d0c592deb956b3a6fe43822f032c51cf629b01e05f4e5208d3f360

jobs:
  data:
    name: Game data
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Cache game data
        id: data-cache
        uses: actions/cache@v4
        with:
          path: DATA
          key: fl-data-${{ env.FL_ISO_MD5 }}-v1

      - name: Fetch and extract game data
        if: steps.data-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iso = Join-Path $env:RUNNER_TEMP 'Freelancer.iso'
          curl.exe --fail --location --retry 3 --silent --show-error -o $iso $env:FL_ISO_URL
          $md5 = (Get-FileHash -Algorithm MD5 $iso).Hash.ToLowerInvariant()
          if ($md5 -ne $env:FL_ISO_MD5) { throw "Freelancer ISO checksum mismatch: $md5" }

          $tmp = Join-Path $env:RUNNER_TEMP 'flx'
          7z e $iso "-o$tmp" CAB1.CAB CAB2.CAB -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed to read the ISO ($LASTEXITCODE)" }
          foreach ($cab in 'CAB1', 'CAB2') {
            7z x (Join-Path $tmp "$cab.CAB") "-o$tmp" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z failed to extract $cab.CAB ($LASTEXITCODE)" }
          }
          Remove-Item $iso

          New-Item -ItemType Directory -Force DATA | Out-Null
          foreach ($part in 'Cab1', 'Cab2') {
            robocopy (Join-Path $tmp "$part/data") DATA /E /NFL /NDL /NJH /NJS /NP | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "robocopy failed for $part ($LASTEXITCODE)" }
          }
          $global:LASTEXITCODE = 0

      - name: Verify game data
        shell: pwsh
        run: |
          $digest = python .github/scripts/data_digest.py DATA
          Write-Host "DATA digest: $digest"
          if ($digest -ne $env:FL_DATA_DIGEST) { throw "DATA digest mismatch, expected $env:FL_DATA_DIGEST" }

  build:
    # On a pull request the PR's base commit is built alongside it, so the regression job can
    # compare the PR's dump with the dump of the code it would change.
    name: ${{ matrix.side == 'base' && 'Release|Win32 (base)' || format('Release|{0}', matrix.platform) }}
    # Visual Studio 2022 (v143) with the ATL/MFC component FLServer needs.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        side: ${{ github.event_name == 'pull_request' && fromJSON('["pr", "base"]') || fromJSON('["pr"]') }}
        platform: [Win32]
        # The port-only x64 build of the server modules (docs/x64.md). Only the PR side: x64
        # output is compared with the Win32 output of the same commit, not with the base.
        include:
          - side: pr
            platform: x64

    steps:
      - uses: actions/checkout@v4
        with:
          # Empty: the event's own commit (for a pull request, its merge commit).
          ref: ${{ matrix.side == 'base' && github.event.pull_request.base.sha || '' }}

      - name: Cache DirectX 8.1 SDK
        id: dx8-cache
        uses: actions/cache@v4
        with:
          path: dx8
          key: dx8-sdk-${{ env.DX8_SDK_MD5 }}

      - name: Fetch DirectX 8.1 SDK headers and libraries
        if: steps.dx8-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'dx81sdk_full.exe'
          curl.exe --fail --location --retry 3 --silent --show-error -o $exe $env:DX8_SDK_URL
          $md5 = (Get-FileHash -Algorithm MD5 $exe).Hash.ToLowerInvariant()
          if ($md5 -ne $env:DX8_SDK_MD5) { throw "DX8 SDK checksum mismatch: $md5" }
          $tmp = Join-Path $env:RUNNER_TEMP 'dx8x'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          tar -xf $exe -C $tmp DXF/DXSDK/include DXF/DXSDK/lib
          if ($LASTEXITCODE -ne 0) { throw "tar failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force dx8 | Out-Null
          Move-Item (Join-Path $tmp 'DXF/DXSDK/include') dx8/include
          Move-Item (Join-Path $tmp 'DXF/DXSDK/lib') dx8/lib
          if (-not (Test-Path dx8/include/d3d8.h) -or -not (Test-Path dx8/lib/d3d8.lib)) {
            throw 'DX8 SDK layout not as expected'
          }

      # RPGPU's SDL3 comes from vcpkg in manifest mode (src/RPGPU/vcpkg.json; the runner's
      # VCPKG_INSTALLATION_ROOT). vcpkg keeps each package it builds as a zip in its binary cache;
      # caching that folder means SDL3 is compiled once per manifest and platform, not per run.
      - name: Cache vcpkg packages
        if: matrix.side == 'pr'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ matrix.platform }}-${{ hashFiles('src/RPGPU/vcpkg.json') }}

      - name: Point vcpkg at the cache
        if: matrix.side == 'pr'
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV

      - uses: microsoft/setup-msbuild@v2

      # MultiToolTask runs each source file as its own compiler process, and
      # EnforceProcessCountAcrossBuilds caps those processes across all projects at the core
      # count. Idle cores then pick up files from any project, so the projects on the critical
      # path (Common, freelancer) are not stuck behind small single-threaded libraries.
      # Neither changes the compiler or linker options.
      - name: Build
        run: >-
          msbuild src\Freelancer.sln -t:Build -m -nologo -v:minimal
          -p:Configuration=Release -p:Platform=${{ matrix.platform }}
          -p:UseMultiToolTask=true -p:EnforceProcessCountAcrossBuilds=true
          -clp:PerformanceSummary -bl:msbuild.binlog

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.side == 'base' && 'msbuild-binlog-base' || (matrix.platform == 'x64' && 'msbuild-binlog-x64' || 'msbuild-binlog') }}
          path: msbuild.binlog
          retention-days: 7

      - name: Upload x64 binaries
        if: matrix.platform == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: freelancer-release-x64
          # The dev ini and character files: the build copies them from bin\ (copy_dev_ini.py).
          path: |
            bin_x64/*.exe
            bin_x64/*.dll
            bin_x64/*.ini
            bin_x64/*.txt
            bin_x64/*.fl
            bin_x64/*.pdb
          if-no-files-found: error
          retention-days: 14

      - name: Upload binaries
        if: matrix.platform == 'Win32'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.side == 'base' && 'freelancer-base-win32' || 'freelancer-release-win32' }}
          path: |
            bin/*.exe
            bin/*.dll
            bin/*.ini
            bin/*.txt
            bin/*.fl
            bin/*.pdb
          if-no-files-found: error
          retention-days: 14

  regress:
    name: Regression (FLRegress)
    needs: [build, data]
    runs-on: windows-2022
    # Stage A (startup) and stage B (930 server frames on a virtual clock) run in one process;
    # FLRegress's own watchdog ends a stuck run after 5 minutes.
    timeout-minutes: 15
    permissions:
      contents: read
      # Only the crash issue step uses it, and only outside pull requests.
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Restore game data
        uses: actions/cache/restore@v4
        with:
          path: DATA
          key: fl-data-${{ env.FL_ISO_MD5 }}-v1
          fail-on-cache-miss: true

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: freelancer-release-win32
          path: bin

      - name: Download base binaries
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: freelancer-base-win32
          path: base

      # The dump holds values read from the game data, so it is compared here and never
      # uploaded; only its SHA-256 and, on a mismatch, the first differing lines are printed.
      # A crash minidump stays on the runner for the same reason (its stacks can hold game
      # data); only the text report leaves it, in the crash issue.
      - name: Run twice and compare
        id: run
        shell: pwsh
        working-directory: bin
        env:
          CRASH_TEST: ${{ inputs.crash_test && '--crash-test' || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($run in 'a', 'b') {
            $extra = @()
            if ($env:CRASH_TEST) { $extra += $env:CRASH_TEST }
            & .\FLRegress.exe --out "regress_$run.txt" --timeout 300 --crash-dir crashes @extra
            if ($LASTEXITCODE -eq 4) {
              $report = Get-ChildItem crashes -Filter *.txt -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($report) { "crash_report=$($report.FullName)" >> $env:GITHUB_OUTPUT }
              throw "FLRegress run $run crashed"
            }
            if ($LASTEXITCODE -ne 0) { throw "FLRegress run $run failed with exit code $LASTEXITCODE" }
          }
          $a = (Get-FileHash -Algorithm SHA256 regress_a.txt).Hash
          $b = (Get-FileHash -Algorithm SHA256 regress_b.txt).Hash
          Write-Host "run a: $a ($((Get-Item regress_a.txt).Length) bytes)"
          Write-Host "run b: $b"
          Get-Content regress_a.txt -TotalCount 3
          # Stage B's script progress and object counts (ids and counts only, no game text).
          Select-String -Path regress_a.txt -Pattern '^(stage_b|player |tick |objects )' | ForEach-Object { $_.Line } | Select-Object -Last 60 | Write-Host
          if ($a -ne $b) {
            Compare-Object (Get-Content regress_a.txt) (Get-Content regress_b.txt) | Select-Object -First 20 | Format-Table -AutoSize | Out-String -Width 400 | Write-Host
            throw 'FLRegress is not deterministic: the two runs differ'
          }

      # One open issue per crash signature (exception code + first symbolised frame): a new
      # crash opens one, the same crash again adds a comment. Pull requests only fail; runs
      # from forks get no token that can write issues, and a PR's crash belongs in its review.
      - name: Open or update the crash issue
        if: >-
          failure() && steps.run.outputs.crash_report != '' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.run.outputs.crash_report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $text = Get-Content -Raw $env:REPORT
          $line = $text -split "`n" | Where-Object { $_ -like 'signature: *' } | Select-Object -First 1
          $signature = if ($line) { $line.Substring(11).Trim() } else { 'unknown' }
          $sha1 = [System.Security.Cryptography.SHA1]::Create()
          $hash = $sha1.ComputeHash([Text.Encoding]::UTF8.GetBytes($signature))
          $id = ([System.BitConverter]::ToString($hash) -replace '-', '').Substring(0, 8).ToLowerInvariant()
          $where = ($signature -split ' ', 2)[-1]
          if ($where.Length -gt 120) { $where = $where.Substring(0, 120) + '...' }
          $title = "FLRegress crash in $where [crash:$id]"

          $body = Join-Path $env:RUNNER_TEMP 'crash_issue.md'
          @(
            "FLRegress crashed on ``$env:GITHUB_REF_NAME`` at $env:GITHUB_SHA ($env:GITHUB_EVENT_NAME)."
            ''
            "Run: $env:RUN_URL"
            ''
            '```'
            $text.TrimEnd()
            '```'
          ) | Set-Content -Encoding utf8 $body

          gh label create flregress-crash --color B60205 --description 'Crash found by FLRegress in CI' --force
          if ($LASTEXITCODE -ne 0) { throw "gh label create failed ($LASTEXITCODE); are issues enabled for the repository?" }
          # Matched on the title here rather than with issue search, which lags behind new issues.
          $open = gh issue list --label flregress-crash --state open --limit 500 --json number,title | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "gh issue list failed ($LASTEXITCODE)" }
          $existing = ($open | Where-Object { $_.title.EndsWith("[crash:$id]") } | Select-Object -First 1).number
          if ($existing) {
            gh issue comment $existing --body-file $body
            Write-Host "Commented on issue #$existing"
          } else {
            gh issue create --title $title --label flregress-crash --body-file $body
          }
          if ($LASTEXITCODE -ne 0) { throw "gh failed to file the crash ($LASTEXITCODE)" }

      # A pull request must not change the dump: the port stays faithful to retail. A PR that
      # changes it on purpose (a retail-fidelity fix) carries the label 'regress: expected
      # change'; the difference is then reported but does not fail the job.
      - name: Compare with the base commit
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          EXPECTED_CHANGE: "${{ contains(github.event.pull_request.labels.*.name, 'regress: expected change') }}"
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path base/FLRegress.exe)) {
            Write-Host '::notice::The base commit has no FLRegress; nothing to compare against.'
            exit 0
          }
          # The game resolves DATA and EXE as siblings of its own folder; base\ sits beside
          # bin\ at the repository root, so both builds read the same data. (EXE\ comes from
          # the PR's checkout: a PR that edits EXE\*.ini is compared on its own INI files.)
          Push-Location base
          & .\FLRegress.exe --out regress_base.txt --timeout 300
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "FLRegress on the base commit failed with exit code $code" }

          $pr = (Get-FileHash -Algorithm SHA256 bin/regress_a.txt).Hash
          $base = (Get-FileHash -Algorithm SHA256 base/regress_base.txt).Hash
          Write-Host "base: $base"
          Write-Host "pr:   $pr"
          if ($pr -ne $base) {
            Compare-Object (Get-Content base/regress_base.txt) (Get-Content bin/regress_a.txt) | Select-Object -First 20 | Format-Table -AutoSize | Out-String -Width 400 | Write-Host
            if ($env:EXPECTED_CHANGE -eq 'true') {
              Write-Host "::warning::FLRegress output differs from the base commit (label 'regress: expected change' is set)."
            } else {
              throw "FLRegress output differs from the base commit. If the change is intended, add the label 'regress: expected change'."
            }
          }

  codecs:
    name: Packet codecs (RpcCodecTest)
    needs: [build]
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: freelancer-release-win32
          path: bin

      - name: Download base binaries
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: freelancer-base-win32
          path: base

      - name: Run twice and compare
        shell: pwsh
        working-directory: bin
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($run in 'a', 'b') {
            & .\RpcCodecTest.exe --out "codecs_$run.txt"
            if ($LASTEXITCODE -ne 0) {
              if (Test-Path "codecs_$run.txt") { Get-Content "codecs_$run.txt" -Tail 12 | Write-Host }
              throw ("RpcCodecTest run $run failed with exit code 0x{0:x8}" -f $LASTEXITCODE)
            }
          }
          $a = (Get-FileHash -Algorithm SHA256 codecs_a.txt).Hash
          $b = (Get-FileHash -Algorithm SHA256 codecs_b.txt).Hash
          Write-Host "run a: $a ($((Get-Item codecs_a.txt).Length) bytes)"
          Write-Host "run b: $b"
          Select-String -Path codecs_a.txt -Pattern '^summary ' | ForEach-Object { Write-Host $_.Line }
          if ($a -ne $b) {
            Compare-Object (Get-Content codecs_a.txt) (Get-Content codecs_b.txt) | Select-Object -First 20 | Format-Table -AutoSize | Out-String -Width 400 | Write-Host
            throw 'RpcCodecTest is not deterministic: the two runs differ'
          }

      # The output holds no game data, so it is kept for review.
      - name: Upload codec results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpc-codecs
          path: bin/codecs_a.txt
          if-no-files-found: ignore
          retention-days: 14

      # A pull request must not change the wire format. A PR that changes it on purpose (a
      # retail-fidelity fix) carries the label 'codecs: expected change'; the difference is
      # then reported but does not fail the job.
      - name: Compare with the base commit
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          EXPECTED_CHANGE: "${{ contains(github.event.pull_request.labels.*.name, 'codecs: expected change') }}"
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path base/RpcCodecTest.exe)) {
            Write-Host '::notice::The base commit has no RpcCodecTest; nothing to compare against.'
            exit 0
          }
          Push-Location base
          & .\RpcCodecTest.exe --out codecs_base.txt
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "RpcCodecTest on the base commit failed with exit code $code" }

          $pr = (Get-FileHash -Algorithm SHA256 bin/codecs_a.txt).Hash
          $base = (Get-FileHash -Algorithm SHA256 base/codecs_base.txt).Hash
          Write-Host "base: $base"
          Write-Host "pr:   $pr"
          if ($pr -ne $base) {
            Compare-Object (Get-Content base/codecs_base.txt) (Get-Content bin/codecs_a.txt) | Select-Object -First 20 | Format-Table -AutoSize | Out-String -Width 400 | Write-Host
            if ($env:EXPECTED_CHANGE -eq 'true') {
              Write-Host "::warning::RpcCodecTest output differs from the base commit (label 'codecs: expected change' is set)."
            } else {
              throw "RpcCodecTest output differs from the base commit. If the change is intended, add the label 'codecs: expected change'."
            }
          }

  dedicated:
    name: Dedicated server (FLDedicated)
    needs: [build, data]
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Restore game data
        uses: actions/cache/restore@v4
        with:
          path: DATA
          key: fl-data-${{ env.FL_ISO_MD5 }}-v1
          fail-on-cache-miss: true

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: freelancer-release-win32
          path: bin

      # RemoteClient hosts through DirectPlay 8, an optional Windows component that Windows
      # Server does not install by default.
      - name: Enable DirectPlay
        shell: pwsh
        run: |
          $feature = Get-WindowsFeature -Name Direct-Play -ErrorAction SilentlyContinue
          if ($feature -and -not $feature.Installed) {
            Install-WindowsFeature -Name Direct-Play | Format-List | Out-String | Write-Host
          } elseif (-not $feature) {
            Enable-WindowsOptionalFeature -Online -FeatureName DirectPlay -All -NoRestart | Out-Null
          }
          Write-Host "DirectPlay: $((Get-WindowsFeature -Name Direct-Play -ErrorAction SilentlyContinue).InstallState)"

      # Starts the server, joins it with Microsoft's DirectPlay 8 client (DPNetCheck, the client
      # side of a retail Freelancer), lets it stop after 45 seconds and checks the log for the
      # startup and shutdown lines.
      - name: Start, join, run and stop
        shell: pwsh
        working-directory: bin
        run: |
          $ErrorActionPreference = 'Stop'
          $proc = Start-Process -FilePath .\FLDedicated.exe -PassThru -NoNewWindow `
            -ArgumentList '--name', 'CI', '--max-players', '4', '--port', '2302', '--run-for', '45' `
            -RedirectStandardOutput dedicated_out.txt -RedirectStandardError dedicated_err.txt
          $null = $proc.Handle  # keeps ExitCode readable after the process ends
          # A client joins once the server is up: Microsoft's DirectPlay 8 client, as in retail.
          $deadline = (Get-Date).AddSeconds(120)
          while (-not $proc.HasExited -and (Get-Date) -lt $deadline) {
            if ((Test-Path dedicated_out.txt) -and (Get-Content -Raw dedicated_out.txt) -match 'Server running, ready for log in\.') { break }
            Start-Sleep -Milliseconds 500
          }
          $check = 1
          if (-not $proc.HasExited) {
            & .\DPNetCheck.exe --host 127.0.0.1 --port 2302 --timeout 15000
            $check = $LASTEXITCODE
          }
          if (-not $proc.WaitForExit(300000)) {
            $proc.Kill()
            Get-Content dedicated_out.txt, dedicated_err.txt | Write-Host
            throw 'FLDedicated did not stop within 5 minutes'
          }
          Get-Content dedicated_out.txt, dedicated_err.txt | Write-Host
          if ($proc.ExitCode -ne 0) { throw ("FLDedicated exited with code 0x{0:x8}" -f $proc.ExitCode) }
          $log = Get-Content -Raw dedicated_out.txt
          foreach ($line in 'Server running, ready for log in.', 'Server stopped.') {
            if (-not $log.Contains($line)) { throw "missing from the log: $line" }
          }
          if ($check -ne 0) { throw "DPNetCheck failed (exit code $check)" }

  # DPNet, the port's own DirectPlay 8 protocol implementation (docs/dpnet.md): portable C++
  # with its own tests, built on Linux (GCC, with sanitizers) and Windows (MSVC, 32 and 64 bit).
  dpnet:
    name: DirectPlay protocol (DPNet, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            configure: -DCMAKE_BUILD_TYPE=Debug -DDPNET_SANITIZE=ON
          - name: Windows Win32
            os: windows-2022
            configure: -A Win32
          - name: Windows x64
            os: windows-2022
            configure: -A x64

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S src/DPNet -B build/dpnet ${{ matrix.configure }}

      - name: Build
        run: cmake --build build/dpnet --config Debug --parallel

      - name: Test
        run: ctest --test-dir build/dpnet --build-config Debug --output-on-failure

  # The port-only x64 server build (docs/x64.md) against the Win32 build of the same commit.
  x64:
    name: x64 server
    needs: [build, data]
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Restore game data
        uses: actions/cache/restore@v4
        with:
          path: DATA
          key: fl-data-${{ env.FL_ISO_MD5 }}-v1
          fail-on-cache-miss: true

      - name: Download Win32 binaries
        uses: actions/download-artifact@v4
        with:
          name: freelancer-release-win32
          path: bin

      - name: Download x64 binaries
        uses: actions/download-artifact@v4
        with:
          name: freelancer-release-x64
          path: bin_x64

      - name: Enable DirectPlay
        shell: pwsh
        run: |
          $feature = Get-WindowsFeature -Name Direct-Play -ErrorAction SilentlyContinue
          if ($feature -and -not $feature.Installed) {
            Install-WindowsFeature -Name Direct-Play | Format-List | Out-String | Write-Host
          } elseif (-not $feature) {
            Enable-WindowsOptionalFeature -Online -FeatureName DirectPlay -All -NoRestart | Out-Null
          }

      # The wire format must not depend on the platform: x64 must encode and decode every
      # packet exactly as Win32 does.
      - name: Packet codecs, x64 against Win32
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($side in 'bin', 'bin_x64') {
            Push-Location $side
            & .\RpcCodecTest.exe --out codecs.txt
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) {
              if (Test-Path "$side/codecs.txt") { Get-Content "$side/codecs.txt" -Tail 12 | Write-Host }
              throw ("RpcCodecTest in $side failed with exit code 0x{0:x8}" -f $code)
            }
          }
          $a = (Get-FileHash -Algorithm SHA256 bin/codecs.txt).Hash
          $b = (Get-FileHash -Algorithm SHA256 bin_x64/codecs.txt).Hash
          Write-Host "win32: $a"
          Write-Host "x64:   $b"
          Select-String -Path bin_x64/codecs.txt -Pattern '^summary ' | ForEach-Object { Write-Host $_.Line }
          if ($a -ne $b) {
            Compare-Object (Get-Content bin/codecs.txt) (Get-Content bin_x64/codecs.txt) | Select-Object -First 40 | Format-Table -AutoSize | Out-String -Width 400 | Write-Host
            throw 'The x64 packet codecs differ from Win32'
          }

      - name: Upload x64 codec results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpc-codecs-x64
          path: |
            bin/codecs.txt
            bin_x64/codecs.txt
          if-no-files-found: ignore
          retention-days: 14

      # The x64 server hosts through DPNet (docs/dpnet.md); DPNetCheck joins it with Microsoft's
      # DirectPlay 8 client, as a retail Freelancer client does.
      - name: FLDedicated x64 (DPNet), start, join with Microsoft's client, run and stop
        id: dedicated_x64
        if: always()
        shell: pwsh
        env:
          FL_HIGH_MEMORY: '1' # x64_high_memory.h: allocations above 4 GB expose truncated addresses
        working-directory: bin_x64
        run: |
          $ErrorActionPreference = 'Stop'
          $proc = Start-Process -FilePath .\FLDedicated.exe -PassThru -NoNewWindow `
            -ArgumentList '--name', 'CI', '--max-players', '4', '--port', '2302', '--run-for', '45' `
            -RedirectStandardOutput dedicated_out.txt -RedirectStandardError dedicated_err.txt
          $null = $proc.Handle  # keeps ExitCode readable after the process ends
          # A client joins once the server is up: Microsoft's DirectPlay 8 client, as in retail.
          $deadline = (Get-Date).AddSeconds(120)
          while (-not $proc.HasExited -and (Get-Date) -lt $deadline) {
            if ((Test-Path dedicated_out.txt) -and (Get-Content -Raw dedicated_out.txt) -match 'Server running, ready for log in\.') { break }
            Start-Sleep -Milliseconds 500
          }
          $check = 1
          if (-not $proc.HasExited) {
            & ..\bin\DPNetCheck.exe --host 127.0.0.1 --port 2302 --timeout 15000
            $check = $LASTEXITCODE
          }
          if (-not $proc.WaitForExit(300000)) {
            $proc.Kill()
            Get-Content dedicated_out.txt, dedicated_err.txt | Write-Host
            throw 'FLDedicated did not stop within 5 minutes'
          }
          Get-Content dedicated_out.txt, dedicated_err.txt | Write-Host
          # Required: the server comes up and a retail client's DirectPlay joins it. Reported
          # only: a clean shutdown (docs/x64.md: engine handles held in 32-bit fields).
          $log = Get-Content -Raw dedicated_out.txt
          if (-not $log.Contains('Server running, ready for log in.')) { throw 'the x64 server did not come up' }
          if ($check -ne 0) { throw "DPNetCheck failed (exit code $check)" }
          if ($proc.ExitCode -ne 0 -or -not $log.Contains('Server stopped.')) {
            Write-Host ("::warning::x64 FLDedicated did not shut down cleanly (exit code 0x{0:x8})" -f $proc.ExitCode)
          }

      # The game-state dump: x64 floating point (SSE2) rounds some results differently from
      # Win32's x87, so the two are compared but a difference is reported, not failed. The
      # dumps hold game data and are not uploaded. Report-only, as above.
      - name: FLRegress, x64 against Win32
        id: regress_x64
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          FL_HIGH_MEMORY: '1' # x64 only; the Win32 run ignores it
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($side in 'bin', 'bin_x64') {
            Push-Location $side
            & .\FLRegress.exe --out regress.txt --timeout 300
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) {
              if (Test-Path "$side/regress.txt") { Get-Content "$side/regress.txt" -Tail 12 | Write-Host }
              throw ("FLRegress in $side failed with exit code 0x{0:x8}" -f $code)
            }
          }
          $a = Get-Content bin/regress.txt
          $b = Get-Content bin_x64/regress.txt
          Write-Host "lines: win32 $($a.Count), x64 $($b.Count)"
          $diff = Compare-Object $a $b
          Write-Host "differing lines: $(@($diff).Count)"
          $diff | Select-Object -First 40 | Format-Table -AutoSize | Out-String -Width 400 | Write-Host

      # When an x64 run crashes, run it again under the console debugger for the stack.
      - name: x64 crash stacks
        if: always() && (steps.dedicated_x64.outcome == 'failure' || steps.regress_x64.outcome == 'failure')
        shell: pwsh
        working-directory: bin_x64
        env:
          FL_HIGH_MEMORY: '1'
        run: |
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          if (-not (Test-Path $cdb)) { Write-Host 'cdb not found'; exit 0 }
          $env:_NT_SYMBOL_PATH = (Get-Location).Path
          # The normal process heap, as in the runs above: the debugger's own heap places
          # allocations differently, and some crashes then do not happen.
          $env:_NO_DEBUG_HEAP = '1'
          foreach ($run in @(@('FLRegress.exe', '--out', 'regress_cdb.txt', '--timeout', '120'),
                             @('FLDedicated.exe', '--name', 'CI', '--max-players', '4', '--port', '2302', '--run-for', '10'))) {
            Write-Host "=== $($run -join ' ')"
            # Stops at the first second-chance exception of any kind, or at the process exit.
            & $cdb -lines -G -c 'g; .lastevent; .ecxr; kn 40; q' @run 2>&1 |
              Select-String -Pattern '^\s*[0-9a-f]{2} |Last event|Access violation|ExceptionAddress|exception|^\w+!|\.(cpp|h)' |
              Select-Object -First 80 | ForEach-Object { Write-Host $_.Line }
          }
