name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # DirectX 8.1 SDK (Final), the archive README.md points to. Only its include\ and lib\
  # folders are extracted; the installer itself is never run.
  DX8_SDK_URL: https://archive.org/download/dx81sdk_full/dx81sdk_full.exe
  DX8_SDK_MD5: 28533018267fa278bb1c603a67d86d2f
  # Retail Freelancer disc image. Its two cabinets hold the 1.1 game data (the 1.1 patch
  # changes no data files). DATA/ is only ever used inside the runner: never commit it and
  # never upload it as an artifact.
  FL_ISO_URL: https://archive.org/download/Freelancer_201807/Freelancer.iso
  FL_ISO_MD5: 208008c116b1ebbf70e32ba440663134
  # File count and digest from .github/scripts/data_digest.py over the extracted DATA/.
  FL_DATA_DIGEST: 8368 7236dc15f7d0c592deb956b3a6fe43822f032c51cf629b01e05f4e5208d3f360

jobs:
  data:
    name: Game data
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Cache game data
        id: data-cache
        uses: actions/cache@v4
        with:
          path: DATA
          key: fl-data-${{ env.FL_ISO_MD5 }}-v1

      - name: Fetch and extract game data
        if: steps.data-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iso = Join-Path $env:RUNNER_TEMP 'Freelancer.iso'
          curl.exe --fail --location --retry 3 --silent --show-error -o $iso $env:FL_ISO_URL
          $md5 = (Get-FileHash -Algorithm MD5 $iso).Hash.ToLowerInvariant()
          if ($md5 -ne $env:FL_ISO_MD5) { throw "Freelancer ISO checksum mismatch: $md5" }

          $tmp = Join-Path $env:RUNNER_TEMP 'flx'
          7z e $iso "-o$tmp" CAB1.CAB CAB2.CAB -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed to read the ISO ($LASTEXITCODE)" }
          foreach ($cab in 'CAB1', 'CAB2') {
            7z x (Join-Path $tmp "$cab.CAB") "-o$tmp" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z failed to extract $cab.CAB ($LASTEXITCODE)" }
          }
          Remove-Item $iso

          New-Item -ItemType Directory -Force DATA | Out-Null
          foreach ($part in 'Cab1', 'Cab2') {
            robocopy (Join-Path $tmp "$part/data") DATA /E /NFL /NDL /NJH /NJS /NP | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "robocopy failed for $part ($LASTEXITCODE)" }
          }
          $global:LASTEXITCODE = 0

      - name: Verify game data
        shell: pwsh
        run: |
          $digest = python .github/scripts/data_digest.py DATA
          Write-Host "DATA digest: $digest"
          if ($digest -ne $env:FL_DATA_DIGEST) { throw "DATA digest mismatch, expected $env:FL_DATA_DIGEST" }

  build:
    name: Release|Win32
    # Visual Studio 2022 (v143) with the ATL/MFC component FLServer needs.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Cache DirectX 8.1 SDK
        id: dx8-cache
        uses: actions/cache@v4
        with:
          path: dx8
          key: dx8-sdk-${{ env.DX8_SDK_MD5 }}

      - name: Fetch DirectX 8.1 SDK headers and libraries
        if: steps.dx8-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'dx81sdk_full.exe'
          curl.exe --fail --location --retry 3 --silent --show-error -o $exe $env:DX8_SDK_URL
          $md5 = (Get-FileHash -Algorithm MD5 $exe).Hash.ToLowerInvariant()
          if ($md5 -ne $env:DX8_SDK_MD5) { throw "DX8 SDK checksum mismatch: $md5" }
          $tmp = Join-Path $env:RUNNER_TEMP 'dx8x'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          tar -xf $exe -C $tmp DXF/DXSDK/include DXF/DXSDK/lib
          if ($LASTEXITCODE -ne 0) { throw "tar failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force dx8 | Out-Null
          Move-Item (Join-Path $tmp 'DXF/DXSDK/include') dx8/include
          Move-Item (Join-Path $tmp 'DXF/DXSDK/lib') dx8/lib
          if (-not (Test-Path dx8/include/d3d8.h) -or -not (Test-Path dx8/lib/d3d8.lib)) {
            throw 'DX8 SDK layout not as expected'
          }

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >-
          msbuild src\Freelancer.sln -t:Build -m -nologo -v:minimal
          -p:Configuration=Release -p:Platform=Win32

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: freelancer-release-win32
          path: |
            bin/*.exe
            bin/*.dll
            bin/*.ini
            bin/*.txt
            bin/*.fl
          if-no-files-found: error
          retention-days: 14

  regress:
    name: Regression (FLRegress)
    needs: [build, data]
    runs-on: windows-2022
    # Stage A takes seconds; FLRegress's own watchdog ends a stuck run after 5 minutes.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Restore game data
        uses: actions/cache/restore@v4
        with:
          path: DATA
          key: fl-data-${{ env.FL_ISO_MD5 }}-v1
          fail-on-cache-miss: true

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: freelancer-release-win32
          path: bin

      # The dump holds values read from the game data, so it is compared here and never
      # uploaded; only its SHA-256 is printed.
      - name: Run twice and compare
        shell: pwsh
        working-directory: bin
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($run in 'a', 'b') {
            & .\FLRegress.exe --out "regress_$run.txt" --timeout 300
            if ($LASTEXITCODE -ne 0) { throw "FLRegress run $run failed with exit code $LASTEXITCODE" }
          }
          $a = (Get-FileHash -Algorithm SHA256 regress_a.txt).Hash
          $b = (Get-FileHash -Algorithm SHA256 regress_b.txt).Hash
          Write-Host "run a: $a ($((Get-Item regress_a.txt).Length) bytes)"
          Write-Host "run b: $b"
          Get-Content regress_a.txt -TotalCount 3
          if ($a -ne $b) {
            Compare-Object (Get-Content regress_a.txt) (Get-Content regress_b.txt) | Select-Object -First 20 | Format-Table -AutoSize | Out-String -Width 400 | Write-Host
            throw 'FLRegress is not deterministic: the two runs differ'
          }
